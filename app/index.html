<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1030">
<title>QUIZVERSE — Learn. Think. Win.</title>
<meta name="description" content="Turn any Class + Topic into a complete 5-stage classroom game show. AI-powered, age-adaptive, teacher-controlled.">
<base href="./">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B1030'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23F5B301' stroke-width='4'/%3E%3Ctext x='32' y='42' font-size='28' font-family='sans-serif' font-weight='800' fill='%2322D3EE' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="qv-aurora" aria-hidden="true">
    <span class="qv-aurora__blob qv-aurora__blob--1"></span>
    <span class="qv-aurora__blob qv-aurora__blob--2"></span>
    <span class="qv-aurora__blob qv-aurora__blob--3"></span>
  </div>
  <div class="qv-stars" aria-hidden="true"></div>

  <main id="qv-root" class="qv-root" data-tier="B" data-screen="landing" role="main"></main>

  <div id="qv-confetti" class="qv-confetti" aria-hidden="true"></div>
  <div id="qv-toast" class="qv-toast" role="status" aria-live="polite"></div>
  <div id="qv-overlay" class="qv-overlay" hidden></div>

  <button id="qv-sound-banner" class="qv-sound-banner" hidden>🔊 Tap to enable sound</button>

  <noscript>
    <p style="color:#fff;padding:24px;font-family:sans-serif">
      QUIZVERSE needs JavaScript to run the game engine. Please enable it and reload.
    </p>
  </noscript>

  <script type="module" src="./app.js"></script>
</body>
</html>
